<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbaza's Service Status</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="footer.js" defer></script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col justify-between selection:bg-blue-600 selection:text-white antialiased">

    <div class="max-w-4xl mx-auto px-4 py-12 w-full">

      <!-- Top Header & Navigation -->
      <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-10 pb-6 border-b border-slate-800/80">
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-blue-500 shadow-[0_0_10px_rgba(59,130,246,0.6)]"></span>
            System Status
          </h1>
          <p class="text-sm text-slate-400 mt-1">Uptime and health monitoring</p>
        </div>

        <!-- Navigation Pill -->
        <nav class="flex bg-slate-900 border border-slate-800 p-1 rounded-xl">
          <a href="index.html" class="px-4 py-1.5 rounded-lg text-sm font-medium text-slate-400 hover:text-white transition-all">
            Home
          </a>
          <a href="status.html" class="px-4 py-1.5 rounded-lg text-sm font-medium bg-slate-800 text-white shadow-sm transition-all">
            Status
          </a>
        </nav>
      </header>

      <!-- Status Content -->
      <main class="space-y-6">
        <!-- Global Status Card -->
        <div id="overall-banner" class="bg-slate-900/80 border border-slate-800 p-5 rounded-2xl flex items-center justify-between">
          <div>
            <div class="text-sm font-semibold text-white flex items-center gap-2" id="overall-title">
              Checking status...
            </div>
            <div class="text-xs text-slate-400 mt-1" id="last-updated">Reading data from GitHub Actions...</div>
          </div>
          <button onclick="loadStatus()" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-lg transition-colors font-medium">
            Refresh
          </button>
        </div>

        <!-- Services Status List -->
        <div id="status-container" class="space-y-3">
          <!-- Loaded via JavaScript from status.json -->
        </div>
      </main>

    </div>

    <!-- Shared Footer -->
    <site-footer></site-footer>

    <script>
      async function loadStatus() {
        const container = document.getElementById('status-container');
        const overallTitle = document.getElementById('overall-title');
        const lastUpdated = document.getElementById('last-updated');

        try {
          const res = await fetch('./status.json?t=' + Date.now());
          if (!res.ok) throw new Error("status.json not found");

          const data = await res.json();
          const date = new Date(data.last_updated);
          lastUpdated.textContent = `Last checked: ${date.toLocaleTimeString()} (${date.toLocaleDateString()})`;

          let allOperational = true;
          container.innerHTML = '';

          data.services.forEach(s => {
            const isUp = s.status === 'up';
            if (!isUp) allOperational = false;

            container.innerHTML += `
            <div class="bg-slate-900/60 border border-slate-800/80 p-4 rounded-xl flex items-center justify-between">
              <div class="space-y-0.5">
                <div class="font-medium text-white text-sm">${s.name}</div>
                <div class="text-xs text-slate-500 truncate max-w-[220px] sm:max-w-none">${s.url}</div>
              </div>
              <div class="flex items-center gap-2.5">
                <span class="text-xs font-mono ${isUp ? 'text-emerald-400' : 'text-rose-400'}">
                  ${isUp ? 'Operational' : 'HTTP ' + s.code}
                </span>
                <span class="relative flex h-2.5 w-2.5">
                  ${isUp ? '<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>' : ''}
                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 ${isUp ? 'bg-emerald-500' : 'bg-rose-500'}"></span>
                </span>
              </div>
            </div>
          `;
          });

          if (allOperational) {
            overallTitle.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span> All Systems Operational`;
          } else {
            overallTitle.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-rose-500 inline-block"></span> Degraded Service`;
          }

        } catch (err) {
          lastUpdated.textContent = "Run your GitHub Action to generate status.json";
          overallTitle.textContent = "No status data found";
          container.innerHTML = `
          <div class="text-xs text-slate-500 p-4 border border-dashed border-slate-800 rounded-xl text-center">
            <code>status.json</code> has not been generated yet. Go to the <b>Actions</b> tab on GitHub and trigger the workflow.
          </div>
        `;
        }
      }

      loadStatus();
    </script>
  </body>
</html>
