<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Status</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
    <div class="max-w-3xl mx-auto px-4 py-12">

      <header class="flex justify-between items-center border-b border-slate-800 pb-6 mb-8">
        <div>
          <h1 class="text-2xl font-bold">System Status</h1>
          <p class="text-sm text-slate-400 mt-1" id="last-updated">Loading status...</p>
        </div>
        <div id="overall-badge" class="px-3 py-1 text-xs rounded-full bg-slate-800 text-slate-400">
          Checking...
        </div>
      </header>

      <div id="service-list" class="space-y-3">
        <!-- Services loaded via JS -->
      </div>

    </div>

    <script>
      async function loadStatus() {
        try {
          // Fetch the JSON generated by your GitHub Action (prevent browser cache)
          const res = await fetch('./status.json?t=' + Date.now());
          const data = await res.json();

          // Update timestamps
          const date = new Date(data.last_updated);
          document.getElementById('last-updated').textContent = `Last checked: ${date.toLocaleString()}`;

          let allUp = true;
          const container = document.getElementById('service-list');
          container.innerHTML = '';

          data.services.forEach(s => {
            const isUp = s.status === 'up';
            if (!isUp) allUp = false;

            container.innerHTML += `
            <div class="bg-slate-900 border border-slate-800 rounded-lg p-4 flex items-center justify-between">
              <div>
                <div class="font-medium text-white">${s.name}</div>
                <div class="text-xs text-slate-500">${s.url}</div>
              </div>
              <div class="flex items-center gap-2">
                <span class="text-xs font-mono ${isUp ? 'text-emerald-400' : 'text-rose-400'}">
                  ${isUp ? 'Operational' : 'Disrupted (' + s.code + ')'}
                </span>
                <span class="h-2.5 w-2.5 rounded-full ${isUp ? 'bg-emerald-500' : 'bg-rose-500'}"></span>
              </div>
            </div>
          `;
          });

          const badge = document.getElementById('overall-badge');
          badge.textContent = allUp ? 'All Systems Operational' : 'Degraded Performance';
          badge.className = `px-3 py-1 text-xs rounded-full font-medium ${
            allUp ? 'bg-emerald-950/60 text-emerald-400 border border-emerald-800' : 'bg-rose-950/60 text-rose-400 border border-rose-800'
          }`;

        } catch (err) {
          document.getElementById('last-updated').textContent = "Status information currently unavailable.";
        }
      }

      loadStatus();
    </script>
  </body>
</html>
