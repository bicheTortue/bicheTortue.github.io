<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbaza Dashboard & Status</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              accent: '#3b82f6',
            }
          }
        }
      }
    </script>
    <style>
/* Smooth tab fade-in */
.tab-content { display: none; }
.tab-content.active { display: block; animation: fadeIn 0.2s ease-in-out; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-blue-600 selection:text-white antialiased">

    <div class="max-w-4xl mx-auto px-4 py-12">

      <!-- Top Header -->
      <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-blue-500 inline-block shadow-[0_0_10px_rgba(59,130,246,0.6)]"></span>
            Homelab Portal
          </h1>
          <p class="text-sm text-slate-400 mt-1">Self-hosted infrastructure & services</p>
        </div>

        <!-- Tab Switcher -->
        <nav class="flex bg-slate-900/90 border border-slate-800 p-1 rounded-xl">
          <button onclick="switchTab('services')" id="tab-btn-services"
                                                  class="tab-btn px-4 py-1.5 rounded-lg text-sm font-medium transition-all bg-slate-800 text-white shadow-sm">
            Services
          </button>
          <button onclick="switchTab('status')" id="tab-btn-status"
                                                class="tab-btn px-4 py-1.5 rounded-lg text-sm font-medium transition-all text-slate-400 hover:text-white flex items-center gap-2">
            Status
            <span id="tab-status-dot" class="w-2 h-2 rounded-full bg-slate-600"></span>
          </button>
        </nav>
      </header>

      <!-- ================= TAB 1: SERVICES HUB ================= -->
      <main id="tab-services" class="tab-content active space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">

          <!-- Service Card 1 -->
          <a href="https://cloud.yourdomain.com" target="_blank" class="group bg-slate-900/60 border border-slate-800 hover:border-slate-700 hover:bg-slate-900/90 p-5 rounded-2xl transition-all block">
            <div class="flex justify-between items-start mb-3">
              <span class="text-2xl">☁️</span>
              <span class="text-slate-500 group-hover:text-slate-300 transition-colors">↗</span>
            </div>
            <h2 class="font-semibold text-white group-hover:text-blue-400 transition-colors">Nextcloud</h2>
            <p class="text-xs text-slate-400 mt-1">Files, sync & backups</p>
          </a>

          <!-- Service Card 2 -->
          <a href="https://hass.yourdomain.com" target="_blank" class="group bg-slate-900/60 border border-slate-800 hover:border-slate-700 hover:bg-slate-900/90 p-5 rounded-2xl transition-all block">
            <div class="flex justify-between items-start mb-3">
              <span class="text-2xl">🏠</span>
              <span class="text-slate-500 group-hover:text-slate-300 transition-colors">↗</span>
            </div>
            <h2 class="font-semibold text-white group-hover:text-blue-400 transition-colors">Home Assistant</h2>
            <p class="text-xs text-slate-400 mt-1">Smart home automation</p>
          </a>

          <!-- Service Card 3 -->
          <a href="https://plex.yourdomain.com" target="_blank" class="group bg-slate-900/60 border border-slate-800 hover:border-slate-700 hover:bg-slate-900/90 p-5 rounded-2xl transition-all block">
            <div class="flex justify-between items-start mb-3">
              <span class="text-2xl">🎬</span>
              <span class="text-slate-500 group-hover:text-slate-300 transition-colors">↗</span>
            </div>
            <h2 class="font-semibold text-white group-hover:text-blue-400 transition-colors">Plex</h2>
            <p class="text-xs text-slate-400 mt-1">Media streaming server</p>
          </a>

          <!-- Service Card 4 -->
          <a href="https://vault.yourdomain.com" target="_blank" class="group bg-slate-900/60 border border-slate-800 hover:border-slate-700 hover:bg-slate-900/90 p-5 rounded-2xl transition-all block">
            <div class="flex justify-between items-start mb-3">
              <span class="text-2xl">🔒</span>
              <span class="text-slate-500 group-hover:text-slate-300 transition-colors">↗</span>
            </div>
            <h2 class="font-semibold text-white group-hover:text-blue-400 transition-colors">Vaultwarden</h2>
            <p class="text-xs text-slate-400 mt-1">Password manager</p>
          </a>

        </div>
      </main>

      <!-- ================= TAB 2: SYSTEM STATUS ================= -->
      <main id="tab-status" class="tab-content space-y-6">
        <!-- Global Status Banner -->
        <div id="overall-banner" class="bg-slate-900/80 border border-slate-800 p-5 rounded-2xl flex items-center justify-between">
          <div>
            <div class="text-sm font-semibold text-white flex items-center gap-2" id="overall-title">
              Checking status...
            </div>
            <div class="text-xs text-slate-400 mt-1" id="last-updated">Reading data from GitHub Actions...</div>
          </div>
          <button onclick="loadStatus()" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-lg transition-colors">
            Refresh
          </button>
        </div>

        <!-- Services Status List -->
        <div id="status-container" class="space-y-3">
          <!-- Injected via JavaScript from status.json -->
        </div>
      </main>

    </div>

    <script>
      // Tab Switching Logic
      function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => {
          el.classList.remove('bg-slate-800', 'text-white');
          el.classList.add('text-slate-400');
        });

        document.getElementById(`tab-${tabId}`).classList.add('active');
        const activeBtn = document.getElementById(`tab-btn-${tabId}`);
        activeBtn.classList.add('bg-slate-800', 'text-white');
        activeBtn.classList.remove('text-slate-400');
      }

      // Load and Render Status from status.json
      async function loadStatus() {
        const container = document.getElementById('status-container');
        const overallTitle = document.getElementById('overall-title');
        const lastUpdated = document.getElementById('last-updated');
        const tabDot = document.getElementById('tab-status-dot');

        try {
          const res = await fetch('./status.json?t=' + Date.now());
          if (!res.ok) throw new Error("status.json not found");

          const data = await res.json();
          const date = new Date(data.last_updated);
          lastUpdated.textContent = `Last checked: ${date.toLocaleTimeString()} (${date.toLocaleDateString()})`;

          let allOperational = true;
          container.innerHTML = '';

          data.services.forEach(s => {
            const isUp = s.status === 'up';
            if (!isUp) allOperational = false;

            container.innerHTML += `
            <div class="bg-slate-900/60 border border-slate-800/80 p-4 rounded-xl flex items-center justify-between">
              <div class="space-y-0.5">
                <div class="font-medium text-white text-sm">${s.name}</div>
                <div class="text-xs text-slate-500 truncate max-w-[220px] sm:max-w-none">${s.url}</div>
              </div>
              <div class="flex items-center gap-2.5">
                <span class="text-xs font-mono ${isUp ? 'text-emerald-400' : 'text-rose-400'}">
                  ${isUp ? 'Operational' : 'HTTP ' + s.code}
                </span>
                <span class="relative flex h-2.5 w-2.5">
                  ${isUp ? '<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>' : ''}
                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 ${isUp ? 'bg-emerald-500' : 'bg-rose-500'}"></span>
                </span>
              </div>
            </div>
          `;
          });

          // Global status updates
          if (allOperational) {
            overallTitle.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span> All Systems Operational`;
            tabDot.className = "w-2 h-2 rounded-full bg-emerald-500";
          } else {
            overallTitle.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-rose-500 inline-block"></span> Degraded Service`;
            tabDot.className = "w-2 h-2 rounded-full bg-rose-500 animate-pulse";
          }

        } catch (err) {
          lastUpdated.textContent = "Run your GitHub Action to generate status.json";
          overallTitle.textContent = "No status data found";
          container.innerHTML = `
          <div class="text-xs text-slate-500 p-4 border border-dashed border-slate-800 rounded-xl text-center">
            <code>status.json</code> hasn't been created yet. Head to your repo's <b>Actions</b> tab and manually run the workflow.
          </div>
        `;
        }
      }

      // Initial load
      loadStatus();
    </script>
  </body>
</html>
